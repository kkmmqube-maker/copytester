<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyTester</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            background: #f7f7f7;
        }

        h1 {
            margin-bottom: 5px;
        }

        .description {
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }

        .toolbar {
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .bold-button {
            width: 45px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }

        .editor {
            width: 100%;
            min-height: 300px;
            box-sizing: border-box;
            padding: 15px;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: white;
            font-size: 16px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .editor:empty:before {
            content: attr(data-placeholder);
            color: #888;
        }

        .analyze-button {
            margin-top: 20px;
            width: 100%;
            padding: 13px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: none;
        }

        .bold-part {
            margin: 8px 0;
            padding: 8px;
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>CopyTester</h1>

    <p class="description">
        실험 보고서의 자연적 표현 중복을 고려한 표절 검사
    </p>


    <label for="experiment">실험 선택</label>

    <select id="experiment">
        <option value="HPLC">HPLC</option>
        <option value="hydrogen">수소 이야기</option>
        <option value="hess">헤스의 법칙</option>
        <option value="iodine">아이오딘 적정</option>
        <option value="pigment">색소의 분리와 흡광 분석</option>
        <option value="henry">이산화탄소의 헨리상수</option>
    </select>


    <label>검사할 텍스트</label>

    <p>
        CopyKiller에서 표절로 탐지된 부분을 드래그한 뒤
        <b>B</b> 버튼을 눌러 굵게 표시하세요.
    </p>


    <div class="toolbar">
        <button
            type="button"
            class="bold-button"
            id="boldButton"
            title="선택 영역 굵게 표시"
        >
            <b>B</b>
        </button>
    </div>


    <div
        id="reportText"
        class="editor"
        contenteditable="true"
        data-placeholder="보고서 텍스트를 여기에 붙여넣으세요."
    ></div>


    <button
        type="button"
        class="analyze-button"
        id="analyzeButton"
    >
        분석하기
    </button>


    <div id="result"></div>


    <!-- 211개 표현 데이터 -->
    <script src="phrases.js"></script>


   
<script>
const editor = document.getElementById("reportText");
const result = document.getElementById("result");

document.getElementById("boldButton").addEventListener("mousedown", function(event) {
    event.preventDefault();
    editor.focus();
    document.execCommand("bold", false, null);
});

function tokenize(text) {
    const regex = /\S+/g;
    const tokens = [];
    let match;

    while ((match = regex.exec(text)) !== null) {
        tokens.push({
            word: match[0].toLowerCase(),
            start: match.index,
            end: match.index + match[0].length
        });
    }

    return tokens;
}

function getEditorData() {
    const text = editor.innerText;
    const tokens = tokenize(text);
    const boldRanges = [];

    // Bold 영역의 문자 범위를 수집
    const walker = document.createTreeWalker(
        editor,
        NodeFilter.SHOW_TEXT
    );

    let node;
    let offset = 0;

    while ((node = walker.nextNode())) {
        const content = node.textContent || "";
        let parent = node.parentElement;
        let isBold = false;

        while (parent && parent !== editor) {
            if (
                parent.tagName === "B" ||
                parent.tagName === "STRONG"
            ) {
                isBold = true;
                break;
            }
            parent = parent.parentElement;
        }

        if (isBold) {
            boldRanges.push({
                start: offset,
                end: offset + content.length
            });
        }

        offset += content.length;
    }

    // innerText와 DOM 텍스트의 줄바꿈 차이를 피하기 위해
    // Bold 어절은 별도로 수집
    const boldWords = new Set();
    const boldElements = editor.querySelectorAll("b, strong");

    boldElements.forEach(element => {
        tokenize(element.innerText).forEach(token => {
            // 실제 위치 매핑은 아래에서 처리
        });
    });

    // DOM Range를 사용해 각 어절의 Bold 여부 판정
    const boldFlags = tokens.map(() => false);

    // 텍스트 노드의 Bold 상태를 순서대로 결합
    const segments = [];
    const walker2 = document.createTreeWalker(
        editor,
        NodeFilter.SHOW_TEXT
    );

    while ((node = walker2.nextNode())) {
        let parent = node.parentElement;
        let isBold = false;

        while (parent && parent !== editor) {
            if (parent.tagName === "B" || parent.tagName === "STRONG") {
                isBold = true;
                break;
            }
            parent = parent.parentElement;
        }

        segments.push({
            text: node.textContent || "",
            bold: isBold
        });
    }

    // 줄바꿈을 포함한 실제 문서 순서대로 어절 재구성
    const domWords = [];
    let current = "";
    let currentBold = false;

    function flushWord() {
        if (current) {
            domWords.push({
                word: current.toLowerCase(),
                bold: currentBold
            });
            current = "";
            currentBold = false;
        }
    }

    segments.forEach(segment => {
        for (const char of segment.text) {
            if (/\s/.test(char)) {
                flushWord();
            } else {
                current += char;
                if (segment.bold) currentBold = true;
            }
        }
    });
    flushWord();

    // 일반적인 붙여넣기/줄바꿈 구조에서 DOM 단어 사용
    return domWords;
}

function normalizeWord(word) {
    return word.toLowerCase().trim();
}

function findDbMatches(words, experiment) {
    const candidates = phraseData
        .filter(item => item.experiment === experiment)
        .map(item => ({
            ...item,
            tokens: tokenize(item.phrase).map(t => normalizeWord(t.word))
        }))
        .sort((a, b) => b.tokens.length - a.tokens.length);

    const occupied = Array(words.length).fill(false);
    const matches = [];

    candidates.forEach(item => {
        const length = item.tokens.length;
        if (!length) return;

        for (let i = 0; i <= words.length - length; i++) {
            let equal = true;

            for (let j = 0; j < length; j++) {
                if (
                    normalizeWord(words[i + j].word) !== item.tokens[j]
                ) {
                    equal = false;
                    break;
                }
            }

            if (!equal) continue;

            // 이미 더 긴 n-gram이 차지한 구간이면 제외
            if (occupied.slice(i, i + length).some(Boolean)) {
                continue;
            }

            for (let j = i; j < i + length; j++) {
                occupied[j] = true;
            }

            matches.push({
                phrase: item.phrase,
                n: length,
                weight: Number(item.weight),
                start: i,
                end: i + length
            });
        }
    });

    return matches;
}

document.getElementById("analyzeButton").addEventListener("click", function() {
    const experiment = document.getElementById("experiment").value;
    const words = getEditorData();

    if (words.length === 0) {
        result.innerHTML = "<p>분석할 문서를 입력해 주세요.</p>";
        result.style.display = "block";
        return;
    }

    const matches = findDbMatches(words, experiment);
    const dbFlags = Array(words.length).fill(false);
    const weights = words.map(word => word.bold ? 1 : 0);

    matches.forEach(match => {
        for (let i = match.start; i < match.end; i++) {
            dbFlags[i] = true;
            weights[i] = Math.max(0, Math.min(1, match.weight));
        }
    });

    const totalWords = words.length;
    const boldCount = words.filter(word => word.bold).length;
    const dbCount = dbFlags.filter(Boolean).length;

    const overlapCount = words.filter(
        (word, i) => word.bold && dbFlags[i]
    ).length;

    const dbOnlyCount = dbCount - overlapCount;
    const boldOnlyCount = boldCount - overlapCount;

    const unionCount = boldCount + dbOnlyCount;

    const correctedTotal = weights.reduce(
        (sum, weight) => sum + weight, 0
    );

    const unionRate = unionCount / totalWords * 100;
    const correctedRate = correctedTotal / totalWords * 100;

    let html = `
        <h2>분석 결과</h2>
        <p>전체 어절 수: <b>${totalWords}</b></p>
        <p>Bold 탐지 어절 수: <b>${boldCount}</b></p>
        <p>DB 탐지 어절 수: <b>${dbCount}</b></p>
        <p>Bold·DB 중복 어절 수: <b>${overlapCount}</b></p>
        <p>DB 추가 탐지 어절 수: <b>${dbOnlyCount}</b></p>
        <p>Bold 단독 탐지 어절 수: <b>${boldOnlyCount}</b></p>
        <p>통합 탐지율: <b>${unionRate.toFixed(2)}%</b></p>
        <hr>
        <h2>가중 보정률 = ${correctedRate.toFixed(2)}%</h2>
        <p>가중 보정값: ${correctedTotal.toFixed(3)}</p>
        <h3>자연 중복 DB 일치 표현</h3>
    `;

    if (matches.length === 0) {
        html += "<p>일치하는 표현이 없습니다.</p>";
    } else {
        matches.forEach((match, index) => {
            html += `
                <div style="padding:12px; margin:10px 0; border:1px solid #ccc;">
                    <b>${index + 1}. ${match.phrase.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</b>
                    <p>n = ${match.n}</p>
                    <p>w = ${match.weight.toFixed(3)}</p>
                    <p>보정값 w × n = ${(match.weight * match.n).toFixed(3)}</p>
                    <p>${words.slice(match.start, match.end).some(word => word.bold) ? "Bold 영역과 중복" : "DB 단독 탐지"}</p>
                </div>
            `;
        });
    }

    result.innerHTML = html;
    result.style.display = "block";
});
</script>
