<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyTester</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            background: #f7f7f7;
        }

        h1 {
            margin-bottom: 5px;
        }

        .description {
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }

        .toolbar {
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .bold-button {
            width: 45px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }

        .editor {
            width: 100%;
            min-height: 300px;
            box-sizing: border-box;
            padding: 15px;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: white;
            font-size: 16px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .editor:empty:before {
            content: attr(data-placeholder);
            color: #888;
        }

        .analyze-button {
            margin-top: 20px;
            width: 100%;
            padding: 13px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: none;
        }

        .bold-part {
            margin: 8px 0;
            padding: 8px;
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>CopyTester</h1>

    <p class="description">
        실험 보고서의 자연적 표현 중복을 고려한 표절 검사
    </p>


    <label for="experiment">실험 선택</label>

    <select id="experiment">
        <option value="HPLC">HPLC</option>
        <option value="hydrogen">수소 이야기</option>
        <option value="hess">헤스의 법칙</option>
        <option value="iodine">아이오딘 적정</option>
        <option value="pigment">색소의 분리와 흡광 분석</option>
        <option value="henry">이산화탄소의 헨리상수</option>
    </select>


    <label>검사할 텍스트</label>

    <p>
        CopyKiller에서 표절로 탐지된 부분을 드래그한 뒤
        <b>B</b> 버튼을 눌러 굵게 표시하세요.
    </p>


    <div class="toolbar">
        <button
            type="button"
            class="bold-button"
            id="boldButton"
            title="선택 영역 굵게 표시"
        >
            <b>B</b>
        </button>
    </div>


    <div
        id="reportText"
        class="editor"
        contenteditable="true"
        data-placeholder="보고서 텍스트를 여기에 붙여넣으세요."
    ></div>


    <button
        type="button"
        class="analyze-button"
        id="analyzeButton"
    >
        분석하기
    </button>


    <div id="result"></div>


    <!-- 211개 표현 데이터 -->
    <script src="phrases.js"></script>


   <script>

    // ----------------------------
    // Bold 버튼
    // ----------------------------

    document
        .getElementById("boldButton")
        .addEventListener("mousedown", function(event) {

            event.preventDefault();
            document.execCommand("bold", false, null);

        });


    // ----------------------------
    // 문자열 정규화
    // ----------------------------

    function normalizeText(text) {

        return text
            .toLowerCase()
            .replace(/\s+/g, " ")
            .trim();

    }


    // ----------------------------
    // 어절 수 계산
    // ----------------------------

    function countWords(text) {

        const normalized = normalizeText(text);

        if (normalized.length === 0) {
            return 0;
        }

        return normalized
            .split(/\s+/)
            .filter(word => word.length > 0)
            .length;

    }


    // ----------------------------
    // Bold 구간 하나 분석
    // ----------------------------

    function analyzeBoldText(text, experiment) {

        const normalizedText = normalizeText(text);

        // 선택한 실험의 데이터만 사용
        // 긴 n-gram부터 검사
        const candidates = phraseData
            .filter(item => item.experiment === experiment)
            .sort((a, b) => b.n - a.n);


        const matches = [];

        // 각 글자가 이미 다른 n-gram에 사용되었는지 기록
        const occupied =
            new Array(normalizedText.length).fill(false);


        candidates.forEach(item => {

            const phrase =
                normalizeText(item.phrase);

            let startIndex = 0;


            while (true) {

                const index =
                    normalizedText.indexOf(
                        phrase,
                        startIndex
                    );


                if (index === -1) {
                    break;
                }


                const endIndex =
                    index + phrase.length;


                // 더 긴 표현과 겹치는지 확인
                let overlap = false;

                for (
                    let i = index;
                    i < endIndex;
                    i++
                ) {

                    if (occupied[i]) {
                        overlap = true;
                        break;
                    }

                }


                // 겹치지 않는 경우만 채택
                if (!overlap) {

                    for (
                        let i = index;
                        i < endIndex;
                        i++
                    ) {

                        occupied[i] = true;

                    }


                    matches.push({

                        phrase: item.phrase,

                        n: item.n,

                        weight: item.weight,

                        correctedValue:
                            item.n * item.weight

                    });

                }


                startIndex =
                    index + phrase.length;

            }

        });


        // Bold된 전체 어절 수
        const boldWordCount =
            countWords(normalizedText);


        // DB와 일치한 부분의 어절 수
        let matchedWordCount = 0;

        matches.forEach(match => {

            matchedWordCount += match.n;

        });


        // DB에 없는 Bold 어절
        // → w = 1로 처리
        const unmatchedWordCount =
            Math.max(
                0,
                boldWordCount - matchedWordCount
            );


        // DB 일치 부분의 보정값
        let matchedCorrectedValue = 0;

        matches.forEach(match => {

            matchedCorrectedValue +=
                match.correctedValue;

        });


        // DB 비일치 부분은 w = 1
        const unmatchedCorrectedValue =
            unmatchedWordCount;


        // 이 Bold 구간의 최종 보정값
        const correctedValue =
            matchedCorrectedValue +
            unmatchedCorrectedValue;


        return {

            matches,

            boldWordCount,

            matchedWordCount,

            unmatchedWordCount,

            correctedValue

        };

    }


    // ----------------------------
    // 분석 버튼
    // ----------------------------

    document
        .getElementById("analyzeButton")
        .addEventListener("click", function() {


            const editor =
                document.getElementById("reportText");


            const experiment =
                document.getElementById("experiment").value;


            const result =
                document.getElementById("result");


            // ----------------------------
            // 전체 보고서 어절 수
            // ----------------------------

            const fullText =
                editor.innerText.trim();


            const totalWords =
                countWords(fullText);


            if (totalWords === 0) {

                result.style.display = "block";

                result.innerHTML =
                    "<b>텍스트를 입력해 주세요.</b>";

                return;

            }


            // ----------------------------
            // Bold 부분 가져오기
            // ----------------------------

            const boldElements =
                editor.querySelectorAll("strong, b");


            if (boldElements.length === 0) {

                result.style.display = "block";

                result.innerHTML =
                    "<b>굵게 표시된 부분이 없습니다.</b><br>" +
                    "CopyKiller에서 탐지된 부분을 굵게 표시해 주세요.";

                return;

            }


            // ----------------------------
            // 전체 계산
            // ----------------------------

            let allMatches = [];

            let totalBoldWords = 0;

            let totalMatchedWords = 0;

            let totalUnmatchedWords = 0;

            let correctedTotal = 0;


            boldElements.forEach(element => {

                const text =
                    element.innerText.trim();


                if (text.length === 0) {
                    return;
                }


                const analysis =
                    analyzeBoldText(
                        text,
                        experiment
                    );


                allMatches =
                    allMatches.concat(
                        analysis.matches
                    );


                totalBoldWords +=
                    analysis.boldWordCount;


                totalMatchedWords +=
                    analysis.matchedWordCount;


                totalUnmatchedWords +=
                    analysis.unmatchedWordCount;


                correctedTotal +=
                    analysis.correctedValue;

            });


            // ----------------------------
            // 원래 탐지율
            // ----------------------------

            const originalRate =
                (totalBoldWords / totalWords) * 100;


            // ----------------------------
            // 보정 표절률
            // ----------------------------

            const correctedRate =
                (correctedTotal / totalWords) * 100;


            // ----------------------------
            // 결과 출력
            // ----------------------------

            let html = "";

            html += "<h2>분석 결과</h2>";


            html +=
                "<p>전체 어절 수: <b>" +
                totalWords +
                "</b></p>";


            html +=
                "<p>CopyKiller 탐지 어절 수: <b>" +
                totalBoldWords +
                "</b></p>";


            html +=
                "<p>자연 중복 DB 일치 어절 수: <b>" +
                totalMatchedWords +
                "</b></p>";


            html +=
                "<p>DB 비일치 탐지 어절 수: <b>" +
                totalUnmatchedWords +
                "</b></p>";


            html +=
                "<p>보정 전 탐지율: <b>" +
                originalRate.toFixed(2) +
                "%</b></p>";


            html +=
                '<div style="' +
                'font-size:24px;' +
                'font-weight:bold;' +
                'margin:20px 0;' +
                'padding:15px;' +
                'border:2px solid #333;' +
                '">' +

                "보정 표절률 = " +
                correctedRate.toFixed(2) +
                "%" +

                "</div>";


            html +=
                "<p>보정표절값 Σ(w × n) + DB 비일치 어절 = <b>" +
                correctedTotal.toFixed(3) +
                "</b></p>";


            // ----------------------------
            // DB 일치 표현 출력
            // ----------------------------

            if (allMatches.length === 0) {

                html +=
                    "<h3>자연 중복 DB 일치 표현</h3>";

                html +=
                    "<p>일치하는 표현이 없습니다. " +
                    "따라서 모든 Bold 어절에 w = 1이 적용됩니다.</p>";

            }

            else {

                html +=
                    "<h3>자연 중복 DB 일치 표현</h3>";


                allMatches.forEach(
                    (match, index) => {


                    html +=
                        '<div class="bold-part">' +

                        "<b>" +
                        (index + 1) +
                        ". " +
                        match.phrase +
                        "</b><br>" +

                        "n = " +
                        match.n +
                        "<br>" +

                        "w = " +
                        match.weight.toFixed(3) +
                        "<br>" +

                        "보정값 w × n = " +
                        match.correctedValue.toFixed(3) +

                        "</div>";

                });

            }

            html +=
                "<hr>" +
                "<p>전체 어절 수: <b>" +
                totalWords +
                "</b></p>";
            
            html +=
                "<p>보정표절값: <b>" +
                correctedTotal.toFixed(3) +
                "</b></p>";
            
            html +=
                "<p style='font-size:24px; font-weight:bold;'>" +
                "보정 표절률: " +
                correctedRate.toFixed(2) +
                "%" +
                "</p>";
            result.innerHTML = html;

            result.style.display = "block";

        });

</script>
